name: First Workflow

on:
  push:
    branches:
      - Lab2

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sonarqube Scan
        uses: sonarsource/sonarqube-scan-action@v2
        with:
          projectBaseDir: ./Lab0
          args: >
            -Dsonar.host.url=http://34.57.226.101:9000
            -Dsonar.projectKey=myapp
            -Dsonar.sources=.
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Build Docker
        run: docker build -t kanengggg/myapp:v1 ./Lab0

      - name: Login to Docker
        uses: docker/login-action@v3
        with: 
            username: ${{ vars.DOCKER_HUB_USERNAME }}
            password: ${{ secrets.DOCKER_HUB_TOKEN}}
          
      - name: Push Docker Image
        run: docker push kanengggg/myapp:v1