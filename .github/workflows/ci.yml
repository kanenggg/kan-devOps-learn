name: First Workflow

on:
  push:
    branches:
      - Lab1

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Sonaqube scan
        uses: sonarsource/sonarqube-scan-action@v2
        env:
          SONAP_TOKEN: ${{ secrets.SONAP_TOKEN}}
          SONAP_HOST_URL: ${{ secrets.HOST_URL}}

      - name: Build Docker
        run: docker build -t USERNAME/myapp:v1 ./Lab0

      - name: Login Docker
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME}}" --password-stdin
          
      - name: Push DOCKER Image
        run: docker push USERNAME/myapp:v1