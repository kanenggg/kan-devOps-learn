name: minik8s

on:
    push:
        branches:
            - Lab4

jobs:
    minik8s:
        runs-on: self-hosted

        steps:
            - name: CheckOut
              uses: actions/checkout@v4

            - name: SonarQube Scan
              uses: sonarsource/sonarqube-scan-action@v2
              with:
                projectBaseDir: Lab0
              env:
                SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
                SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
                
            - name: Login To Docker
              uses: docker/login-action@v3
              with:
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_PASSWORD }}
            
            - name: Build Image
              run: docker build -t ${{ secrets.DOCKER_USERNAME }}/myapp:latest ./Lab0
            
            - name: Push Docker Image
              run: docker push ${{ secrets.DOCKER_USERNAME }}/myapp:latest

            - name: Pull image
              run: docker pull ${{ secrets.DOCKER_USERNAME }}/myapp:latest

    deploy:
      runs-on: self-hosted
      needs: minik8s

      steps:
        - name: CheckOut
          uses: actions/checkout@v4
        
        - name: Check Minikube Status
          run: minikube status

        - name: Set kubectl context to Minikube
          run: kubectl config use-context minikube

        - name: Deploy to Minikube
          run: |
           kubectl apply -f ./Lab0/deployment.yaml
           kubectl apply -f ./Lab0/service.yaml

        - name: Update Image
          run: kubectl set image deployment/myapp myapp=${{ secrets.DOCKER_USERNAME }}/myapp:latest

        - name: Check Pods
          run: kubectl get pods -o wide

        - name: Check Server
          run: kubectl get svc

        # 4. Forward port for Kubernetes
        - name: Forward Port for Kubernetes
          run: |
           # 1. ค้นหาและปิดการทำงานของ port-forward ตัวเก่าก่อน (ถ้ามี)
           pkill -f "kubectl port-forward" || true
           # 2. ปิด process ที่ใช้ port 30010 อยู่
           fuser -k 30010/tcp || true
           sleep 2
           # 3. รัน port-forward ใหม่
           kubectl port-forward --address 0.0.0.0 service/myapp-service 30010:80 &
        
