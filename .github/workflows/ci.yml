name: First Workflow

on:
  push:
    branches:
      - Lab2

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker
        run: docker build -t myapp:v1 ./Lab0

      - name: Stop Container
        run: |
          docker stop myapp || true
          docker rm myapp || true
          
      - name: Start Containera
        run:
          docker run -d -p 3000:3000 --name myapp myapp:v1